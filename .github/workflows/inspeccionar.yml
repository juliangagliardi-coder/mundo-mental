name: Inspeccionar Palacio Mental

on:
  push:
    branches: [main, "evolucion/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prueba-por-modulo:
    name: ${{ matrix.modulo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modulo:
          - test_aspecto
          - test_biblioteca
          - test_biblioteca_sqlite
          - test_corazon
          - test_curiosidad
          - test_observacion
          - test_viabilidad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v tests/${{ matrix.modulo }}.py

  ciclo-y-benchmarks:
    name: ${{ matrix.comprobacion }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        comprobacion: [ciclo, viabilidad, comparativa]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ciclo inicial
        if: matrix.comprobacion == 'ciclo'
        run: python iniciar.py
      - name: Viabilidad
        if: matrix.comprobacion == 'viabilidad'
        run: python benchmarks/viabilidad_01.py --sizes 4 8 --output /tmp/viabilidad.json
      - name: Comparativa
        if: matrix.comprobacion == 'comparativa'
        run: python benchmarks/comparar_bibliotecas.py --sizes 4 8 --output /tmp/comparativa.json
