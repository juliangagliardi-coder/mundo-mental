name: Inspeccionar Palacio Mental

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Abrir el Palacio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ejecutar al Inspector
        run: python -m unittest discover -s tests -v
      - name: Ejecutar el primer ciclo
        run: python iniciar.py
      - name: Comprobar Viabilidad 0.1
        run: python benchmarks/viabilidad_01.py --sizes 4 8 --output /tmp/viabilidad.json
