name: Inspeccionar Palacio Mental

on:
  push:
    branches: [main, "evolucion/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas-310:
    runs-on: ubuntu-latest
    steps:
      - name: Abrir el Palacio
        uses: actions/checkout@v4
      - name: Preparar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Ejecutar al Inspector
        run: python -m unittest discover -s tests -v
      - name: Ejecutar el primer ciclo
        run: python iniciar.py
      - name: Comprobar Viabilidad 0.1
        run: python benchmarks/viabilidad_01.py --sizes 4 8 --output /tmp/viabilidad.json
      - name: Comparar Bibliotecas
        run: python benchmarks/comparar_bibliotecas.py --sizes 4 8 --output /tmp/comparativa.json

  pruebas-311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python iniciar.py
      - run: python benchmarks/viabilidad_01.py --sizes 4 8 --output /tmp/viabilidad.json
      - run: python benchmarks/comparar_bibliotecas.py --sizes 4 8 --output /tmp/comparativa.json

  pruebas-312:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python iniciar.py
      - run: python benchmarks/viabilidad_01.py --sizes 4 8 --output /tmp/viabilidad.json
      - run: python benchmarks/comparar_bibliotecas.py --sizes 4 8 --output /tmp/comparativa.json

  pruebas-313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - run: python iniciar.py
      - run: python benchmarks/viabilidad_01.py --sizes 4 8 --output /tmp/viabilidad.json
      - run: python benchmarks/comparar_bibliotecas.py --sizes 4 8 --output /tmp/comparativa.json
