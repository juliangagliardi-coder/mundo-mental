name: Inspeccionar Mundo Mental

on:
  push:
    branches: [main, "evolucion/**", "saneamiento/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Comprobar sintaxis
        run: python -m compileall -q mundo_mental benchmarks iniciar.py
      - name: Ejecutar todas las pruebas
        run: python -m unittest discover -s tests -v
      - name: Ejecutar ciclo integrado
        run: python iniciar.py

  viabilidad:
    name: Benchmarks de humo
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python benchmarks/viabilidad_01.py --sizes 4 8 --output /tmp/viabilidad.json
      - run: python benchmarks/comparar_bibliotecas.py --sizes 4 8 --output /tmp/comparativa.json
      - run: python benchmarks/catalogador_01.py --size 8 --queries 4 --output /tmp/catalogador.json
