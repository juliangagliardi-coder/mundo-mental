name: Inspeccionar Palacio Mental

on:
  push:
    branches: [main, "evolucion/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostico-pruebas:
    name: diagnostico-pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v

  diagnostico-ciclo:
    name: diagnostico-ciclo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python iniciar.py

  diagnostico-viabilidad:
    name: diagnostico-viabilidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python benchmarks/viabilidad_01.py --sizes 4 8 --output /tmp/viabilidad.json

  diagnostico-comparativa:
    name: diagnostico-comparativa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python benchmarks/comparar_bibliotecas.py --sizes 4 8 --output /tmp/comparativa.json

  pruebas-multiversion:
    name: pruebas-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
